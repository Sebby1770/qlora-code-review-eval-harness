[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-tuner"
dynamic = ["version"]
description = "QLoRA fine-tuning and golden-set evaluation harness for code review comment generation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sebastian Forbes" }]
keywords = ["qlora", "llm", "code-review", "evaluation", "peft"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Sebby1770/qlora-code-review-eval-harness"
Repository = "https://github.com/Sebby1770/qlora-code-review-eval-harness"
Issues = "https://github.com/Sebby1770/qlora-code-review-eval-harness/issues"
Changelog = "https://github.com/Sebby1770/qlora-code-review-eval-harness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "mypy>=1.10.0",
  "pytest>=8.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "twine>=5.0.0",
]
train = [
  "accelerate>=0.34.0",
  "bitsandbytes>=0.43.0; platform_system != 'Darwin'",
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "pyyaml>=6.0.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "trl>=0.16.0",
]
eval-embeddings = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
review-train-qlora = "review_tuner.train_qlora:main"
review-eval = "review_tuner.evaluate:main"
review-infer = "review_tuner.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_tuner = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "review_tuner.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=review_tuner --cov-report=term-missing --cov-fail-under=75"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["review_tuner"]
