name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble static site
        run: |
          mkdir -p _site/samples
          cp src/review_tuner/studio_web/index.html \
             src/review_tuner/studio_web/styles.css \
             src/review_tuner/studio_web/app.js \
             src/review_tuner/studio_web/eval-engine.js \
             src/review_tuner/studio_web/404.html \
             _site/
          cp src/review_tuner/studio_web/samples/*.jsonl _site/samples/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
